<!DOCTYPE html>
<html>
<head>
    <title>Mockup Toko E-commerce</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f5f5f5; }
        header { background: #2d89ef; color: white; padding: 15px 20px; text-align: center; }
        .banner { background: #ffc107; text-align: center; padding: 40px 20px; }
        .produk { padding: 30px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 10px; padding: 15px; text-align: center; }
        .card img { width: 100%; height: 140px; object-fit: cover; }
        .card p { color: #2d89ef; font-weight: bold; }
        footer { background: #333; color: white; text-align: center; padding: 20px; margin-top: 20px; }
    </style>
</head>
<body>
    <header><h1>MOCKUP TOKO E-COMMERCE</h1></header>
    <div class="banner"><h2>SELAMAT DATANG DI TOKO</h2><p>Contoh Halaman Penjual</p></div>
    <div class="produk"><h2>Produk</h2>
        <div class="grid">
            <div class="card"><img src="https://via.placeholder.com/180"><h3>Produk 1</h3><p>Rp 50.000</p></div>
            <div class="card"><img src="https://via.placeholder.com/180"><h3>Produk 2</h3><p>Rp 100.000</p></div>
        </div>
    </div>
    <footer><p>© 2026 Mockup Penjual</p></footer>
</body>
</html>
