<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MochiShop</title>
<style>
:root{--pink:#FF4DA6;--pink2:#FFE4F1}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--pink2);padding-bottom:80px}
header{background:var(--pink);color:white;padding:14px 16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:800}
.search-wrap{display:flex;padding:12px 16px;background:var(--pink);gap:8px}
.search-wrap input{flex:1;padding:12px;border-radius:25px;border:none}
.search-wrap button{background:white;color:var(--pink);border:none;border-radius:25px;padding:0 20px;font-weight:700}
.tabs{display:flex;gap:10px;padding:12px 16px;overflow-x:auto}
.tab{padding:10px 18px;background:white;border-radius:25px;color:var(--pink);font-weight:700;cursor:pointer}
.tab.active{background:var(--pink);color:white}
.subtabs{display:flex;gap:8px;padding:0 16px
