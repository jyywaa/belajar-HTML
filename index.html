 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f5f5f5; }
        header { background: #2d89ef; color: white; padding: 20px; text-align: center; }
        header h1 { font-size: 24px; }
        .banner { background: #ffc107; text-align: center; padding: 40px 20px; }
        .banner h2 { font-size: 28px; color: #000; }
        .produk { padding: 30px 20px; max-width: 1000px; margin: auto; }
        .produk h2 { text-align: center; margin-bottom: 20px; font-size: 22px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .card h3 { font-size: 18px; margin-bottom: 8px; }
        .card p { color: #2d89ef; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .card button { background: #2d89ef; color: white; border: none; padding: 10px; border-radius: 5px; width: 100%; cursor: pointer; }
        footer { background: #333; color: white; text-align: center; padding: 20px; margin-top: 30px; }
    </style>
</head>
<body>
    <header>
        <h1>TOKO ONLINE</h1>
    </header>

    <div class="banner">
        <h2>SELAMAT DATANG DI TOKO</h2>
    </div>

    <div class="produk">
        <h2>Produk Kami</h2>
        <div class="grid">
            <div class="card">
                <img src="https://via.placeholder.com/200x160" alt="Produk 1">
                <h3>Produk 1</h3>
                <p>Rp 50.000</p>
                <button>Beli Sekarang</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/200x160" alt="Produk 2">
                <h3>Produk 2</h3>
                <p>Rp 100.000</p>
                <button>Beli Sekarang</button>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/200x160" alt="Produk 3">
                <h3>Produk 3</h3>
                <p>Rp 75.000</p>
                <button>Beli Sekarang</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Toko Online. Semua Hak Dilindungi.</p>
    </footer>
</body>
</html>
