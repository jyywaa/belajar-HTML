<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azaria Store - Sepatu Elegan & Premium</title>
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #1E3A2B;
            --secondary: #2C4D3B;
            --accent: #D4AF37;
            --bg: #F4F6F4;
            --surface: #FFFFFF;
            --text-main: #1A201C;
            --text-muted: #627267;
            --border: #E2E8E4;
            --shadow-sm: 0 2px 8px rgba(30, 58, 43, 0.06);
            --shadow-md: 0 4px 16px rgba(30, 58, 43, 0.1);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: 75px;
            overflow-x: hidden;
            user-select: none;
        }

        /* --- Header & Navigation --- */
        .header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .brand-logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: -0.5px;
        }

        .brand-logo span {
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--primary);
            position: relative;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--accent);
            color: #000;
            font-size: 0.65rem;
            font-weight: 700;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 12px 0;
            border-top: 1px solid var(--border);
            z-index: 100;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.04);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            width: 20%;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 700;
        }

        .nav-item i {
            width: 22px;
            height: 22px;
        }

        /* --- Layout & View System --- */
        .view-container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- UI Components --- */
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--surface);
        }

        .btn-primary:active {
            background: var(--secondary);
            transform: scale(0.98);
        }

        .btn-accent {
            background: var(--accent);
            color: #1A201C;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--primary);
            color: var(--primary);
        }

        .btn-danger {
            background: #FFE5E5;
            color: #D32F2F;
        }

        /* --- Toast Notification --- */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--primary);
            color: var(--surface);
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid var(--accent);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* --- Onboarding Modal (Wizard) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .onboarding-card {
            background: var(--surface);
            width: 100%;
            max-width: 400px;
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .wizard-steps {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
        }

        .wizard-step-dot {
            height: 4px;
            flex: 1;
            background: var(--border);
            border-radius: 2px;
            transition: background 0.3s;
        }

        .wizard-step-dot.active {
            background: var(--accent);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        /* --- Home View --- */
        .bestseller-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 12px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .bestseller-scroll::-webkit-scrollbar { display: none; }

        .bestseller-card {
            flex: 0 0 200px;
            scroll-snap-align: start;
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 10px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .product-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #eee;
        }

        .product-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .product-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 2px;
            color: #E6A100;
            font-weight: 600;
        }

        .card-actions {
            margin-top: auto;
            display: flex;
            gap: 6px;
        }

        .card-actions .btn {
            padding: 6px;
            font-size: 0.75rem;
            border-radius: var(--radius-sm);
        }

        /* --- Product Detail View --- */
        .detail-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }

        .option-group {
            margin: 16px 0;
        }

        .option-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .option-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            cursor: pointer;
            background: var(--surface);
            transition: all 0.2s;
        }

        .chip.active {
            border-color: var(--primary);
            background: var(--primary);
            color: var(--surface);
            font-weight: 600;
        }

        .reviews-list {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .review-item {
            background: var(--surface);
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .review-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.75rem;
            color: #000;
        }

        /* --- Cart View --- */
        .cart-item {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            border: 1px solid var(--border);
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-title {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .cart-item-variant {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 2px 0 4px 0;
        }

        .cart-item-price {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary);
        }

        .cart-summary {
            background: var(--surface);
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            margin-top: 16px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .summary-row.total {
            font-weight: 700;
            color: var(--text-main);
            font-size: 1rem;
            border-top: 1px dashed var(--border);
            padding-top: 8px;
            margin-top: 8px;
        }

        /* --- Profile View --- */
        .profile-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
        }

        .profile-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--primary);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 auto 12px auto;
            border: 2px solid var(--accent);
        }

        .badge-vip {
            background: linear-gradient(45deg, #1E3A2B, #D4AF37);
            color: #FFF;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-top: 4px;
        }

        .info-list {
            background: var(--surface);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .info-item {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-size: 0.85rem;
            border-bottom: 1px solid var(--border);
        }

        .info-item:last-child { border-bottom: none; }
        .info-label { color: var(--text-muted); font-size: 0.8rem; }
        .info-val { font-weight: 600; font-size: 0.8rem; text-align: right; }

        /* --- Order Status View --- */
        .order-card {
            background: var(--surface);
            border-radius: var(--radius-md);
            padding: 16px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }

        .order-status {
            color: #2e7d32;
            background: #e8f5e9;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>

    <!-- Dynamic Toast Notification -->
    <div id="toast" class="toast">
        <i data-lucide="info" style="width:18px;height:18px;"></i>
        <span id="toast-text">Notifikasi</span>
    </div>

    <!-- Sticky Header -->
    <header class="header">
        <div class="brand-logo">
            <i data-lucide="footprints" style="color:var(--accent);"></i>
            AZARIA <span>STORE</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="switchView('cart')">
                <i data-lucide="shopping-bag"></i>
                <div class="badge" id="cart-badge">0</div>
            </button>
        </div>
    </header>

    <!-- Onboarding Wizard Overlay -->
    <div id="onboarding-overlay" class="modal-overlay" style="display:none;">
        <div class="onboarding-card">
            <div class="wizard-steps">
                <div class="wizard-step-dot active" id="dot-1"></div>
                <div class="wizard-step-dot" id="dot-2"></div>
                <div class="wizard-step-dot" id="dot-3"></div>
            </div>

            <!-- Step 1 -->
            <div id="step-1" class="wizard-content">
                <h3 style="color:var(--primary); margin-bottom: 4px;">Selamat Datang!</h3>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px;">Masukkan email aktif Anda untuk memulai.</p>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="input-email" class="form-control" placeholder="nama@email.com">
                </div>
                <button class="btn btn-primary" onclick="nextStep(1)">Lanjutkan <i data-lucide="arrow-right"></i></button>
            </div>

            <!-- Step 2 -->
            <div id="step-2" class="wizard-content" style="display:none;">
                <h3 style="color:var(--primary); margin-bottom: 4px;">Buat Akun</h3>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px;">Atur nama pengguna dan kata sandi Anda.</p>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="input-username" class="form-control" placeholder="username_azaria">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="input-password" class="form-control" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" onclick="nextStep(2)">Lanjutkan <i data-lucide="arrow-right"></i></button>
            </div>

            <!-- Step 3 -->
            <div id="step-3" class="wizard-content" style="display:none;">
                <h3 style="color:var(--primary); margin-bottom: 4px;">Lengkapi Profil</h3>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px;">Nomor telepon untuk konfirmasi pesanan COD.</p>
                <div class="form-group">
