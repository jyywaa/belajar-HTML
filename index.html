<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MochiShop - Admin & Shop</title>
  
  <style>
    /* STYLES DASAR UTAMA */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333;
    }

    /* MODAL CUSTOM ESTETIK (DEFAULT HIDDEN DENGAN DISPLAY NONE) */
    .mochi-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: none; /* Dipastikan tersembunyi saat awal muat */
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }

    .mochi-modal-overlay.active {
      display: flex !important; /* Hanya muncul saat dipanggil JS */
    }

    .mochi-modal-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(255, 51, 133, 0.2);
      text-align: center;
    }

    .mochi-modal-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ff3385;
      margin-bottom: 8px;
    }

    .mochi-modal-input {
      width: 100%;
      padding: 10px 12px;
      margin: 15px 0;
      border: 2px solid #ffccd5;
      border-radius: 8px;
      outline: none;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .mochi-modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .mochi-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .mochi-btn-cancel {
      background-color: #eee;
      color: #555;
    }

    .mochi-btn-primary {
      background-color: #ff3385;
      color: white;
    }

    /* STYLING TABEL ADMIN BARANG */
    .tabel-container {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    th {
      background-color: #fff0f5;
      color: #ff3385;
    }

    .btn-edit-harga {
      background-color: #ffc107;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- AREA TABEL VIEW & EDIT HARGA -->
  <div class="tabel-container">
    <h2 style="color: #ff3385;">View & Edit Harga Barang</h2>
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Nama Barang</th>
          <th>Harga Beli</th>
          <th>Harga Jual</th>
          <th>Aksi Edit</th>
        </tr>
      </thead>
      <tbody id="tabelHargaBody">
        <!-- Data diisi otomatis oleh JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- MODAL CUSTOM UNTUK EDIT HARGA & NOTIFIKASI -->
  <div id="mochiModal" class="mochi-modal-overlay">
    <div class="mochi-modal-box">
      <div id="modalTitle" class="mochi-modal-title">Edit Harga Barang</div>
      <p id="modalDescription" style="color: #666; font-size: 0.9rem; margin: 0;"></p>
      <input type="number" id="modalInput" class="mochi-modal-input" placeholder="Masukkan harga baru..." />
      <div class="mochi-modal-actions">
        <button id="modalBtnCancel" class="mochi-btn mochi-btn-cancel">Batal</button>
        <button id="modalBtnConfirm" class="mochi-btn mochi-btn-primary">Simpan</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
