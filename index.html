<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MochiShop</title>
<style>
  :root{ --pink:#FF69B4; --white:#FFFFFF; --text:#333; }
  *{margin:0;padding:0;box-sizing:border-box;font-family: system-ui, sans-serif;}
  body{background:var(--white);color:var(--text);padding-bottom:70px;}
  header{background:var(--pink);color:var(--white);padding:12px 16px;position:sticky;top:0;}
  .logo{font-size:20px;font-weight:800;}
  .search{display:flex;margin-top:8px;}
  .search input{flex:1;padding:10px;border-radius:20px;border:none;}
  .search button{background:var(--white);border:none;border-radius:20px;padding:0 14px;margin-left:6px;color:var(--pink);font-weight:700;}
  .tabs{display:flex;gap:10px;overflow-x:auto;padding:12px 16px;background:#FFE4F1;}
  .tab{padding:8px 14px;background:var(--white);border-radius:20px;font-weight:600;color:var(--pink);cursor:pointer;}
  .tab.active{background:var(--pink);color:var(--white);}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px;}
  .card{background:var(--white);border:1px solid #eee;border-radius:16px;overflow:hidden;cursor:pointer;}
  .card img{width:100%;height:140px;object-fit:cover;}
  .card .info{padding:10px;}
  .price{color:var(--pink);font-weight:800;}
  .avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;}
  .avatar-small{width:32px;height:32px;border-radius:50%;object-fit:cover;margin-right:6px;vertical-align:middle;}
  .comment{background:#FFE4F1;padding:8px;border-radius:10px;margin-top:6px;font-size:13px;}
  .btn{background:var(--pink);color:var(--white);border:none;padding:12px;border-radius:12px;font-weight:700;width:100%;cursor:pointer;}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:var(--white);border-top:1px solid #eee;padding:8px 0;}
  .nav-item{text-align:center;font-size:12px;color:#666;cursor:pointer;}
  .nav-item.active{color:var(--pink);font-weight:700;}
  .page{display:none;padding:16px;} .page.active{display:block;}
</style>
</head>
<body>

<header>
  <div class="logo">🍡 MochiShop</div>
  <div class="search">
    <input id="searchInput" placeholder="Cari ayam geprek, cardigan, matcha...">
    <button onclick="search()">Cari</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="setTab('home', this)">Home</div>
  <div class="tab" onclick="setTab('food', this)">MochiFood</div>
  <div class="tab" onclick="setTab('outfit', this)">MochiOutfit</div>
  <div class="tab" onclick="setTab('promo', this)">Promo</div>
</div>

<div id="home" class="page active"><h3>Rekomendasi</h3><div class="grid" id="homeGrid"></div></div>
<div id="food" class="page"><div class="grid" id="foodGrid"></div></div>
<div id="outfit" class="page"><div class="grid" id="outfitGrid"></div></div>
<div id="promo" class="page"><h3>Diskon Hingga 50%</h3><div class="grid" id="promoGrid"></div></div>

<div id="detail" class="page">
  <button class="btn" style="background:#ccc;color:#333" onclick="back()">← Kembali</button>
  <div id="detailContent" style="margin-top:12px;"></div>
</div>

<div id="cart" class="page">
  <h3>Keranjang</h3><div id="cartList"></div>
  <button class="btn" onclick="checkout()">Checkout via MochiPay</button>
</div>

<div id="account" class="page">
  <div style="display:flex;gap:12px;align-items:center;">
    <img src="https://via.placeholder.com/60/FF69B4/FFFFFF?text=S" class="avatar">
    <div><h3>Syera</h3><p>syera@email.com</p></div>
  </div>
  <button class="btn" style="margin-top:16px;background:#ddd;color:#333" onclick="alert('Edit Akun')">Edit Akun</button>
  <button class="btn" style="margin-top:8px;background:#ddd;color:#333" onclick="alert('Pengaturan')">Pengaturan</button>
  <button class="btn" style="margin-top:8px" onclick="alert('MochiPay: Saldo Rp120.000')">MochiPay</button>
</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="nav('home')">Home</div>
  <div class="nav-item" onclick="nav('cart')">Keranjang</div>
  <div class="nav-item" onclick="nav('account')">Akun</div>
</div>

<script>
const avatars = {
  Syera: "https://via.placeholder.com/60/FF69B4/FFFFFF?text=S",
  Niel:  "https://via.placeholder.com/60/4DA6FF/FFFFFF?text=N", 
  Karel: "https://via.placeholder.com/60/4CAF50/FFFFFF?text=K",
  Ata:   "https://via.placeholder.com/60/FF9800/FFFFFF?text=A",
  Carmen:"https://via.placeholder.com/60/9C27B0/FFFFFF?text=C",
  Karina:"https://via.placeholder.com/60/FFEB3B/333333?text=Ka",
  Rindi: "https://via.placeholder.com/60/00BCD4/FFFFFF?text=R"
};

const products = [
  {id:1,nama:"Ayam Geprek",harga:18000,diskon:22000,img:"https://images.unsplash.com/photo-1606756790138-261d2b800f0b?w=400",kat:"food"},
  {id:2,nama:"Nasi Goreng",harga:25000,diskon:30000,img:"https://images.unsplash.com/photo-1604908177453-7462950a6a3b?w=400",kat:"food"},
  {id:3,nama:"Matcha Latte",harga:22000,img:"https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=400",kat:"food"},
  {id:4,nama:"Es Krim Mochi",harga:15000,img:"https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=400",kat:"food"},
  {id:5,nama:"Cardigan Rajut Pink",harga:120000,diskon:150000,img:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=400",kat:"outfit"},
  {id:6,nama:"Sweater Oversize",harga:135000,img:"https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?w=400",kat:"outfit"},
  {id:7,nama:"Jeans Biru",harga:160000,diskon:200000,img:"https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=400",kat:"outfit"},
  {id:8,nama:"Polo Premium",harga:110000,img:"https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=400",kat:"outfit"}
];

let cart = [];
const komentar = [
  {nama:"Karina",text:"Enak banget, packing rapi!"},
  {nama:"Rindi",text:"Ukuran pas, bahan adem"},
  {nama:"Niel",text:"Pengiriman cepat Semarang"},
  {nama:"Carmen",text:"Harga worth it sama rasa"}
];

function renderGrid(list, target){
  document.getElementById(target).innerHTML = list.map(p=>`
    <div class="card" onclick="showDetail(${p.id})">
      <img src="${p.img}">
      <div class="info">
        <div>${p.nama}</div>
        <div><span class="price">Rp${p.harga.toLocaleString()}</span></div>
      </div>
    </div>
  `).join('');
}

function init(){
  renderGrid(products, 'homeGrid');
  renderGrid(products.filter(p=>p.kat=='food'), 'foodGrid');
  renderGrid(products.filter(p=>p.kat=='outfit'), 'outfitGrid');
  renderGrid(products.filter(p=>p.diskon), 'promoGrid');
}
init();

function showDetail(id){
  const p = products.find(x=>x.id==id);
  document.getElementById('detailContent').innerHTML = `
    <img src="${p.img}" style="width:100%;border-radius:16px;">
    <h2>${p.nama}</h2>
    <div class="price">Rp${p.harga.toLocaleString()}</div>
    <button class="btn" onclick="addCart(${p.id})">+ Masukkan Keranjang</button>
    <h4 style="margin-top:12px;">Komentar</h4>
    ${komentar.map(k=>`
      <div class="comment">
        <img src="${avatars[k.nama]}" class="avatar-small"><b>${k.nama}:</b> ${k.text}
      </div>
    `).join('')}
  `;
  setTab('detail');
}

function addCart(id){ cart.push(products.find(x=>x.id==id)); alert('Ditambahkan ke keranjang'); renderCart(); }
function renderCart(){
  document.getElementById('cartList').innerHTML = cart.length==0 ? "<p>Keranjang kosong</p>" :
  cart.map((c,i)=>`<div style="display:flex;gap:10px;margin-bottom:10px;"><img src="${c.img}" style="width:60px;height:60px;border-radius:10px;"><div>${c.nama}<br>Rp${c.harga.toLocaleString()}</div></div>`).join('');
}
function checkout(){ alert('Checkout berhasil via MochiPay!'); cart=[]; renderCart(); nav('home'); }
function search(){ const q = document.getElementById('searchInput').value.toLowerCase(); renderGrid(products.filter(p=>p.nama.toLowerCase().includes(q)), 'homeGrid'); setTab('home'); }
function setTab(id, el){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function nav(page){ setTab(page); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); event.target.classList.add('active'); }
function back(){ setTab('home'); }
</script>
</body>
</html>
