<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header id="main-header" class="hidden">
        <h1><i class="fa-solid fa-bag-shopping"></i> AZARIYA <span id="user-role-badge" class="user-badge">Role</span></h1>
        <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </header>

    <div class="container">

        <!-- 0. LOGIN FORM -->
        <div id="view-login" class="auth-card">
            <h2><i class="fa-solid fa-lock"></i> Masuk Ke Akun</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username / Email</label>
                    <input type="text" id="login-user" class="form-control" placeholder="Masukkan username atau email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-pass" class="form-control" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="btn-primary">Masuk Sekarang</button>
            </form>
            <p style="margin-top:15px; font-size: 0.8rem; color: #666; text-align:center;">
                *Admin: <b>meila</b> / <b>meila123</b><br>
                *Customer: Gunakan Username & Pass Bebas
            </p>
        </div>

        <!-- 1. ADMIN PANEL SECTION -->
        <div id="view-admin-panel" class="hidden">
            <div class="admin-panel">
                <h2><i class="fa-solid fa-box-archive"></i> Panel Manajemen Produk (Admin)</h2>
                <form id="product-form" onsubmit="saveProduct(event)">
                    <input type="hidden" id="edit-product-id">
                    <div class="form-group">
                        <label>Nama Produk</label>
                        <input type="text" id="prod-title" class="form-control" placeholder="Contoh: iPhone 15 Pro Max" required>
                    </div>
                    <div class="form-group">
                        <label>Deskripsi & Harga</label>
                        <textarea id="prod-desc" class="form-control" rows="3" placeholder="Spesifikasi lengkap & Rp 22.000.000" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Upload Foto Produk (Gambar)</label>
                        <input type="file" id="prod-img-file" class="form-control" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>Upload Video Produk (Demo Video)</label>
                        <input type="file" id="prod-video-file" class="form-control" accept="video/*">
                    </div>
                    <button type="submit" class="btn-primary" style="background: var(--primary);"><i class="fa-solid fa-floppy-disk"></i> Simpan Produk ke Database</button>
                </form>
            </div>

            <div class="admin-panel">
                <h2><i class="fa-solid fa-truck-ramp-box"></i> Laporan Status Pengiriman Customer</h2>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom:15px;">
                    <span style="font-size:0.9rem; color:#555;">Daftar Transaksi Masuk</span>
                    <button onclick="clearOrderHistory()" class="btn-action btn-delete" style="max-width: 180px;"><i class="fa-solid fa-trash"></i> Hapus Riwayat</button>
                </div>
                <div id="admin-orders-list">
                    <!-- Dynamic Orders List for Admin -->
                </div>
            </div>
        </div>

        <!-- 2. BERANDA / KATALOG PRODUK -->
        <div id="view-home" class="hidden">
            <h2 style="margin-bottom: 15px; color: var(--primary);"><i class="fa-solid fa-store"></i> Katalog Barang</h2>
            <div id="product-grid" class="product-grid">
                <!-- Products dynamically rendered here -->
            </div>
        </div>

        <!-- 3. KERANJANG -->
        <div id="view-cart" class="hidden">
            <h2 style="margin-bottom: 15px; color: var(--primary);"><i class="fa-solid fa-cart-shopping"></i> Keranjang Saya</h2>
            <div id="cart-list"></div>
            <div id="cart-total" style="margin-top: 15px; font-weight: bold; font-size:1.1rem;"></div>
        </div>

        <!-- 4. PROFIL -->
        <div id="view-profile" class="hidden">
            <div class="admin-panel">
                <h2><i class="fa-solid fa-user"></i> Profil Pengguna</h2>
                <p><strong>Username/Email:</strong> <span id="prof-username">-</span></p>
                <p><strong>Role Hak Akses:</strong> <span id="prof-role">-</span></p>
            </div>
        </div>

        <!-- 5. STATUS PESANAN (PEMBELI) -->
        <div id="view-orders" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="color: var(--primary);"><i class="fa-solid fa-truck-fast"></i> Status Pesanan</h2>
                <button onclick="clearOrderHistory()" class="btn-action btn-delete" style="max-width: 160px;"><i class="fa-solid fa-trash"></i> Hapus Riwayat</button>
            </div>
            <div id="buyer-orders-list">
                <!-- Dynamic Buyer Order History -->
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar for Buyer & Admin Navigation -->
    <nav id="bottom-nav" class="bottom-nav hidden">
        <button class="nav-item active" onclick="switchTab('home')" id="nav-home">
            <i class="fa-solid fa-house"></i>
            <span>Beranda</span>
        </button>
        <button class="nav-item" onclick="switchTab('cart')" id="nav-cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Keranjang</span>
        </button>
        <button class="nav-item" onclick="switchTab('profile')" id="nav-profile">
            <i class="fa-solid fa-user"></i>
            <span>Profil</span>
        </button>
        <button class="nav-item" onclick="switchTab('orders')" id="nav-orders">
            <i class="fa-solid fa-box"></i>
            <span>Pesanan</span>
        </button>
    </nav>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
