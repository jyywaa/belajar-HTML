<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online - Shopee Style</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f5f5f5; }
        
        /* SISTEM 2 LAYAR PAKE :target */
        .page { display: none; }
        .page:target { display: block; }
        #home { display: block; }
        .page:target ~ #home { display: none; }

        header { background: #ee4d2d; color: white; padding: 12px 15px; position: sticky; top: 0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: white; text-decoration: none; font-size: 20px; }

        /* LAYAR 1: DAFTAR */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; }
        .card { background: white; border-radius: 8px; overflow: hidden; text-decoration: none; color: black; }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-info { padding: 8px; }
        .card p { color: #ee4d2d; font-weight: bold; }

        /* LAYAR 2: DETAIL */
        .detail img { width: 100%; height: 300px; object-fit: cover; }
        .detail-info { padding: 15px; background: white; }
        .detail-harga { color: #ee4d2d; font-size: 22px; font-weight: bold; }
        .bar-bawah { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 10px; display: flex; gap: 10px; }
        .btn-beli { flex: 1; background: #ee4d2d; color: white; border: none; padding: 12px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- LAYAR 2: DETAIL -->
    <div class="page" id="detail1">
        <header><div class="navbar"><a href="#home" class="back-btn">←</a><div>Detail Produk</div><div>🛒</div></div></header>
        <div class="detail">
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600">
            <div class="detail-info">
                <h2>Kaos Polos Premium</h2>
                <div class="detail-harga">Rp 89.000</div>
                <p>Bahan: Cotton Combed 30s, tebal dan adem</p>
            </div>
        </div>
        <div class="bar-bawah"><button class="btn-beli">Beli Sekarang</button></div>
    </div>

    <!-- LAYAR 1: HOME -->
    <div class="page" id="home">
        <header><div class="navbar"><div class="logo">TOKO ONLINE</div><div>🛒</div></div></header>
        <div class="grid">
            <a href="#detail1" class="card">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400">
                <div class="card-info"><h3>Kaos Polos Premium</h3><p>Rp 89.000</p></div>
            </a>
        </div>
    </div>

</body>
</html>
